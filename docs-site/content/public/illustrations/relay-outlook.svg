<svg xmlns="http://www.w3.org/2000/svg" width="720" height="758" viewBox="0 0 720 758" role="img" aria-labelledby="title desc"><title id="title">Outlook 中继：先建应用再授权</title><desc id="desc">在微软注册应用、后台保存应用配置、添加账号、微软授权并检测。</desc><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="720" height="758" fill="#f4f9f7" stroke="#e2ece7"/><text x="36" y="48" fill="#087f6c" font-size="16" font-weight="700">CAOCONG TEMPMAIL / 配置手册</text><text x="36" y="93" fill="#173c35" font-size="30" font-weight="700">Outlook 中继：先建应用再授权</text><rect x="36" y="124" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="146" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="177" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">1</text><text x="118" y="163" fill="#173c35" font-size="23" font-weight="700">注册微软应用</text><text x="118" y="197" fill="#546c65" font-size="18">Azure 门户 → 应用注册 → 个人 Microsoft 账户</text><rect x="36" y="260" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="282" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="313" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">2</text><text x="118" y="299" fill="#173c35" font-size="23" font-weight="700">登记回调地址</text><text x="118" y="333" fill="#546c65" font-size="18">Web 平台：https://你的域名/api/admin/microsoft/callback</text><rect x="36" y="396" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="418" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="449" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">3</text><text x="118" y="435" fill="#173c35" font-size="23" font-weight="700">保存应用配置</text><text x="118" y="469" fill="#546c65" font-size="18">中继邮箱 → 微软授权 → 填 Client ID 和 Secret Value</text><rect x="36" y="532" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="554" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="585" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">4</text><text x="118" y="571" fill="#173c35" font-size="23" font-weight="700">添加账号并授权</text><text x="118" y="605" fill="#546c65" font-size="18">添加账号 → 点“微软授权” → 检测并启用</text><text x="40" y="686" fill="#087f6c" font-size="21" font-weight="700">Outlook 不填密码，靠 OAuth2 授权收信。</text><text x="36" y="726" fill="#5a756d" font-size="16">操作示意 · 非真实截图 · 示例地址请替换</text></g></svg>