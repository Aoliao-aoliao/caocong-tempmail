<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc"><title id="title">把源码放到服务器</title><desc id="desc">从 GitHub 下载 ZIP，在 1Panel 文件管理上传解压，找到 Dockerfile。</desc><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="720" height="620" rx="0" fill="#f4f9f7" stroke="#e2ece7"/><text x="36" y="48" fill="#087f6c" font-size="16" font-weight="700">CAOCONG TEMPMAIL / 安装手册</text><text x="36" y="93" fill="#173c35" font-size="30" font-weight="700">把源码放到服务器</text><rect x="36" y="122" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="144" width="44" height="44" rx="12" fill="#087f6c" stroke="#087f6c"/><text x="70" y="175" fill="#fff" font-size="24" font-weight="700">1</text><text x="118" y="161" fill="#173c35" font-size="24" font-weight="700">GitHub → Code → Download ZIP</text><text x="118" y="193" fill="#546c65" font-size="19" font-weight="400">先下载到自己的电脑</text><rect x="36" y="252" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="274" width="44" height="44" rx="12" fill="#087f6c" stroke="#087f6c"/><text x="70" y="305" fill="#fff" font-size="24" font-weight="700">2</text><text x="118" y="291" fill="#173c35" font-size="24" font-weight="700">1Panel → 系统 → 文件</text><text x="118" y="323" fill="#546c65" font-size="19" font-weight="400">进入 /opt/nodemail，再上传、解压</text><rect x="36" y="382" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="404" width="44" height="44" rx="12" fill="#087f6c" stroke="#087f6c"/><text x="70" y="435" fill="#fff" font-size="24" font-weight="700">3</text><text x="118" y="421" fill="#173c35" font-size="24" font-weight="700">打开解压后的文件夹</text><text x="118" y="453" fill="#546c65" font-size="19" font-weight="400">看到 Dockerfile、installer 才是源码根目录</text><text x="40" y="550" fill="#087f6c" font-size="23" font-weight="700">示例：/opt/nodemail/nodemail-main</text><text x="36" y="596" fill="#5a756d" font-size="16" font-weight="400">操作示意 · 非面板截图 · 示例地址请替换</text></g></svg>