<svg xmlns="http://www.w3.org/2000/svg" width="720" height="758" viewBox="0 0 720 758" role="img" aria-labelledby="title desc"><title id="title">找回密码：先配好发信邮箱</title><desc id="desc">配置发信邮箱后，用户才能收到找回密码验证码。</desc><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="720" height="758" fill="#f4f9f7" stroke="#e2ece7"/><text x="36" y="48" fill="#087f6c" font-size="16" font-weight="700">CAOCONG TEMPMAIL / 配置手册</text><text x="36" y="93" fill="#173c35" font-size="30" font-weight="700">找回密码：先配好发信邮箱</text><rect x="36" y="124" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="146" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="177" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">1</text><text x="118" y="163" fill="#173c35" font-size="23" font-weight="700">准备专用发信邮箱</text><text x="118" y="197" fill="#546c65" font-size="18">建议单独邮箱，开启 SMTP 和应用密码</text><rect x="36" y="260" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="282" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="313" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">2</text><text x="118" y="299" fill="#173c35" font-size="23" font-weight="700">后台填写发信配置</text><text x="118" y="333" fill="#546c65" font-size="18">系统配置 → 密码找回发信 → 主机、465/587</text><rect x="36" y="396" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="418" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="449" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">3</text><text x="118" y="435" fill="#173c35" font-size="23" font-weight="700">开启并保存</text><text x="118" y="469" fill="#546c65" font-size="18">勾选“启用密码找回邮件”</text><rect x="36" y="532" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="554" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="585" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">4</text><text x="118" y="571" fill="#173c35" font-size="23" font-weight="700">自己走一遍</text><text x="118" y="605" fill="#546c65" font-size="18">退出登录 → 忘记密码 → 收到验证码</text><text x="40" y="686" fill="#087f6c" font-size="21" font-weight="700">保存成功不代表能投递，要亲自测一次。</text><text x="36" y="726" fill="#5a756d" font-size="16">操作示意 · 非真实截图 · 示例地址请替换</text></g></svg>