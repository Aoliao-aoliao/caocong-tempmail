<svg xmlns="http://www.w3.org/2000/svg" width="720" height="894" viewBox="0 0 720 894" role="img" aria-labelledby="title desc"><title id="title">五种域名，谁能用？</title><desc id="desc">免费、登录用户、会员、私有、中继五种域名的使用范围。</desc><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="720" height="894" fill="#f4f9f7" stroke="#e2ece7"/><text x="36" y="48" fill="#087f6c" font-size="16" font-weight="700">CAOCONG TEMPMAIL / 配置手册</text><text x="36" y="93" fill="#173c35" font-size="30" font-weight="700">五种域名，谁能用？</text><rect x="36" y="124" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="146" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="177" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">1</text><text x="118" y="163" fill="#173c35" font-size="23" font-weight="700">免费域名</text><text x="118" y="197" fill="#546c65" font-size="18">访客和所有用户都能申请</text><rect x="36" y="260" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="282" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="313" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">2</text><text x="118" y="299" fill="#173c35" font-size="23" font-weight="700">登录用户域名</text><text x="118" y="333" fill="#546c65" font-size="18">注册登录后才能申请</text><rect x="36" y="396" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="418" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="449" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">3</text><text x="118" y="435" fill="#173c35" font-size="23" font-weight="700">会员域名</text><text x="118" y="469" fill="#546c65" font-size="18">有效会员才能申请和召回</text><rect x="36" y="532" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="554" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="585" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">4</text><text x="118" y="571" fill="#173c35" font-size="23" font-weight="700">私有域名</text><text x="118" y="605" fill="#546c65" font-size="18">会员自己添加，管理员核实后启用，仅本人可用</text><rect x="36" y="668" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="690" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="721" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">5</text><text x="118" y="707" fill="#173c35" font-size="23" font-weight="700">中继域名</text><text x="118" y="741" fill="#546c65" font-size="18">来自 Gmail / Outlook 账号，在中继邮箱里维护</text><text x="40" y="822" fill="#087f6c" font-size="21" font-weight="700">新加的域名先解析 MX，检测通过才能启用。</text><text x="36" y="862" fill="#5a756d" font-size="16">操作示意 · 非真实截图 · 示例地址请替换</text></g></svg>