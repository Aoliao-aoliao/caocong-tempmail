<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc"><title id="title">网站与数据，分别在哪里？</title><desc id="desc">网站流量经过 HTTPS 代理进入应用；数据库与附件保存在自己的服务器。</desc><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="720" height="620" rx="0" fill="#f4f9f7" stroke="#e2ece7"/><text x="36" y="48" fill="#087f6c" font-size="16" font-weight="700">CAOCONG TEMPMAIL / 安装手册</text><text x="36" y="93" fill="#173c35" font-size="30" font-weight="700">网站与数据，分别在哪里？</text><rect x="36" y="124" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="146" width="44" height="44" rx="12" fill="#087f6c" stroke="#087f6c"/><text x="70" y="177" fill="#fff" font-size="24" font-weight="700">1</text><text x="118" y="163" fill="#173c35" font-size="24" font-weight="700">用户打开网站</text><text x="118" y="195" fill="#546c65" font-size="19" font-weight="400">mail.example.com → HTTPS 443</text><rect x="36" y="254" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="276" width="44" height="44" rx="12" fill="#087f6c" stroke="#087f6c"/><text x="70" y="307" fill="#fff" font-size="24" font-weight="700">2</text><text x="118" y="293" fill="#173c35" font-size="24" font-weight="700">OpenResty 转发请求</text><text x="118" y="325" fill="#546c65" font-size="19" font-weight="400">本机 127.0.0.1:4321 → 草丛临时邮箱</text><rect x="36" y="384" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="406" width="44" height="44" rx="12" fill="#087f6c" stroke="#087f6c"/><text x="70" y="437" fill="#fff" font-size="24" font-weight="700">3</text><text x="118" y="423" fill="#173c35" font-size="24" font-weight="700">草丛临时邮箱 保存数据</text><text x="118" y="455" fill="#546c65" font-size="19" font-weight="400">MySQL：账号和记录；附件卷：文件</text><text x="40" y="550" fill="#087f6c" font-size="23" font-weight="700">数据库不需要开放公网 3306 端口。</text><text x="36" y="596" fill="#5a756d" font-size="16" font-weight="400">操作示意 · 非面板截图 · 示例地址请替换</text></g></svg>