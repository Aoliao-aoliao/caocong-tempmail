<svg xmlns="http://www.w3.org/2000/svg" width="720" height="758" viewBox="0 0 720 758" role="img" aria-labelledby="title desc"><title id="title">NodeLoc 登录：申请应用</title><desc id="desc">在 NodeLoc 创建 OAuth 应用，填写回调地址与权限，审核通过后在后台启用。</desc><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="720" height="758" fill="#f4f9f7" stroke="#e2ece7"/><text x="36" y="48" fill="#087f6c" font-size="16" font-weight="700">CAOCONG TEMPMAIL / 配置手册</text><text x="36" y="93" fill="#173c35" font-size="30" font-weight="700">NodeLoc 登录：申请应用</text><rect x="36" y="124" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="146" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="177" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">1</text><text x="118" y="163" fill="#173c35" font-size="23" font-weight="700">创建 OAuth 应用</text><text x="118" y="197" fill="#546c65" font-size="18">NodeLoc 应用管理（需 TL2 及以上账号）</text><rect x="36" y="260" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="282" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="313" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">2</text><text x="118" y="299" fill="#173c35" font-size="23" font-weight="700">填回调地址和权限</text><text x="118" y="333" fill="#546c65" font-size="18">/api/auth/nodeloc/callback · openid profile email</text><rect x="36" y="396" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="418" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="449" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">3</text><text x="118" y="435" fill="#173c35" font-size="23" font-weight="700">等待 email 权限审核</text><text x="118" y="469" fill="#546c65" font-size="18">状态变为“已批准”后才能拿到邮箱</text><rect x="36" y="532" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="554" width="44" height="44" rx="12" fill="#087f6c"/><text x="78" y="585" fill="#fff" font-size="24" font-weight="700" text-anchor="middle">4</text><text x="118" y="571" fill="#173c35" font-size="23" font-weight="700">后台保存并启用</text><text x="118" y="605" fill="#546c65" font-size="18">系统配置 → NodeLoc 登录 → 填 Client ID / Secret</text><text x="40" y="686" fill="#087f6c" font-size="21" font-weight="700">可在 NodeLoc 设最低信任等级，挡住小号。</text><text x="36" y="726" fill="#5a756d" font-size="16">操作示意 · 非真实截图 · 示例地址请替换</text></g></svg>