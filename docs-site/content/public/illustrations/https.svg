<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" role="img" aria-labelledby="title desc"><title id="title">开启 HTTPS 后再登录</title><desc id="desc">申请域名证书，在网站 HTTPS 配置中选择证书，然后打开登录页。</desc><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="720" height="620" rx="0" fill="#f4f9f7" stroke="#e2ece7"/><text x="36" y="48" fill="#087f6c" font-size="16" font-weight="700">CAOCONG TEMPMAIL / 安装手册</text><text x="36" y="93" fill="#173c35" font-size="30" font-weight="700">开启 HTTPS 后再登录</text><rect x="36" y="124" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="146" width="44" height="44" rx="12" fill="#087f6c" stroke="#087f6c"/><text x="70" y="177" fill="#fff" font-size="24" font-weight="700">1</text><text x="118" y="163" fill="#173c35" font-size="24" font-weight="700">证书 → 申请或上传</text><text x="118" y="195" fill="#546c65" font-size="19" font-weight="400">证书要包含你的网站域名</text><rect x="36" y="254" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="276" width="44" height="44" rx="12" fill="#087f6c" stroke="#087f6c"/><text x="70" y="307" fill="#fff" font-size="24" font-weight="700">2</text><text x="118" y="293" fill="#173c35" font-size="24" font-weight="700">网站配置 → HTTPS</text><text x="118" y="325" fill="#546c65" font-size="19" font-weight="400">启用，选择证书，自动跳转 HTTPS</text><rect x="36" y="384" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="406" width="44" height="44" rx="12" fill="#087f6c" stroke="#087f6c"/><text x="70" y="437" fill="#fff" font-size="24" font-weight="700">3</text><text x="118" y="423" fill="#173c35" font-size="24" font-weight="700">打开登录页</text><text x="118" y="455" fill="#546c65" font-size="19" font-weight="400">https://你的域名/user/login.cgi</text><text x="40" y="550" fill="#087f6c" font-size="23" font-weight="700">使用刚创建的管理员，没有默认密码。</text><text x="36" y="596" fill="#5a756d" font-size="16" font-weight="400">操作示意 · 非面板截图 · 示例地址请替换</text></g></svg>