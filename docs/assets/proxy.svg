<svg xmlns="http://www.w3.org/2000/svg" width="720" height="716" viewBox="0 0 720 716" role="img" aria-labelledby="title desc"><title id="title">网站创建时，这几项这样填</title><desc id="desc">主域名、代理地址与别名的填写示意；仅适用于 OpenResty host 网络。</desc><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="720" height="716" rx="0" fill="#f4f9f7" stroke="#e2ece7"/><text x="36" y="48" fill="#087f6c" font-size="16" font-weight="700">NODEMAIL / 安装手册</text><text x="36" y="93" fill="#173c35" font-size="30" font-weight="700">网站创建时，这几项这样填</text><rect x="36" y="124" width="648" height="446" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="36" y="124" width="648" height="54" rx="16" fill="#e4f3ed" stroke="#d9e8e3"/><text x="58" y="159" fill="#173c35" font-size="23" font-weight="700">创建网站 / 反向代理</text><text x="58" y="216" fill="#546c65" font-size="21" font-weight="400">① 主域名</text><rect x="58" y="230" width="602" height="54" rx="8" fill="#fff" stroke="#9ccbbb"/><text x="76" y="266" fill="#173c35" font-size="26" font-weight="400">mail.example.com</text><text x="58" y="325" fill="#546c65" font-size="21" font-weight="400">② 代理地址</text><rect x="58" y="339" width="602" height="54" rx="8" fill="#fff" stroke="#9ccbbb"/><text x="76" y="375" fill="#173c35" font-size="26" font-weight="400">http://127.0.0.1:4321</text><text x="58" y="434" fill="#546c65" font-size="21" font-weight="400">③ 代号 / 别名</text><rect x="58" y="448" width="602" height="54" rx="8" fill="#fff" stroke="#9ccbbb"/><text x="76" y="484" fill="#173c35" font-size="26" font-weight="400">nodemail</text><text x="38" y="615" fill="#087f6c" font-size="24" font-weight="700">先确认：OpenResty 网络模式是 host。</text><text x="38" y="653" fill="#546c65" font-size="22" font-weight="400">代理目标填 http，用户访问网站用 https。</text><text x="36" y="692" fill="#5a756d" font-size="16" font-weight="400">操作示意 · 非面板截图 · 示例地址请替换</text></g></svg>