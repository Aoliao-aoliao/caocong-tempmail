<svg xmlns="http://www.w3.org/2000/svg" width="720" height="632" viewBox="0 0 720 632" role="img" aria-labelledby="title desc"><title id="title">网站和邮件，走不同入口</title><desc id="desc">说明 HTTPS 网页入口、SMTP 收信入口与上游中继三条路径。</desc><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="720" height="632" rx="0" fill="#f4f9f7" stroke="#e2ece7"/><text x="36" y="48" fill="#087f6c" font-size="16" font-weight="700">CAOCONG TEMPMAIL / 安装手册</text><text x="36" y="93" fill="#173c35" font-size="30" font-weight="700">网站和邮件，走不同入口</text><rect x="36" y="124" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="146" width="44" height="44" rx="12" fill="#087f6c" stroke="#087f6c"/><text x="70" y="177" fill="#fff" font-size="24" font-weight="700">1</text><text x="118" y="163" fill="#173c35" font-size="24" font-weight="700">网页访问这条路</text><text x="118" y="195" fill="#546c65" font-size="19" font-weight="400">浏览器 → mail.example.com → 443</text><rect x="36" y="260" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="282" width="44" height="44" rx="12" fill="#087f6c" stroke="#087f6c"/><text x="70" y="313" fill="#fff" font-size="24" font-weight="700">2</text><text x="118" y="299" fill="#173c35" font-size="24" font-weight="700">邮件投递这条路</text><text x="118" y="331" fill="#546c65" font-size="19" font-weight="400">发件服务器 → 查 MX → mx.example.com:25</text><rect x="36" y="396" width="648" height="114" rx="16" fill="#fff" stroke="#d9e8e3"/><rect x="56" y="418" width="44" height="44" rx="12" fill="#087f6c" stroke="#087f6c"/><text x="70" y="449" fill="#fff" font-size="24" font-weight="700">3</text><text x="118" y="435" fill="#173c35" font-size="24" font-weight="700">另一种选择：中继收信</text><text x="118" y="467" fill="#546c65" font-size="19" font-weight="400">已有邮箱 → IMAP / OAuth → 草丛临时邮箱</text><text x="40" y="566" fill="#087f6c" font-size="22" font-weight="700">网页能打开，不代表 MX 和收信已经配好。</text><text x="36" y="608" fill="#5a756d" font-size="16" font-weight="400">操作示意 · 非面板截图 · 示例地址请替换</text></g></svg>